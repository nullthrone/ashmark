name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1, luacheck and busted
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks --lua-version=5.1 install luacheck
          sudo luarocks --lua-version=5.1 install busted

      - name: Lint
        run: luacheck .

      - name: Test
        run: busted

      - name: Conflict data is current
        run: python3 tools/conflicts.py --check

      - name: Conflict generator tests
        run: python3 -B -m unittest discover -s tools -p "test_*.py"

      - name: TOC files agree and list only existing files
        run: python3 tools/toc_check.py --strict
