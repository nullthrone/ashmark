name: Release

on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: ubuntu-24.04
    # The packager creates or updates the GitHub release and uploads the zip to it; the default
    # GITHUB_TOKEN of this organization is read-only, which fails that step with a 403.
    permissions:
      contents: write
    env:
      # The packager uploads to CurseForge only when CF_API_KEY is set and the TOC
      # carries ## X-Curse-Project-ID; otherwise it builds the zip and the GitHub release.
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
